# YT 品牌家具官网 · Nginx 配置（步骤 7.8）
# 生产架构：www 子域 → 前台静态；sys 子域 → 后台静态；/api → uvicorn(:8000)
# 依据：实施方案 v2.1 §12 部署方案

# ---------- 前台 www.yt-domain.com ----------
server {
    listen 443 ssl http2;
    server_name www.yt-domain.com;

    ssl_certificate     /etc/nginx/ssl/www.yt-domain.com.pem;      # Let's Encrypt / 云厂商证书
    ssl_certificate_key /etc/nginx/ssl/www.yt-domain.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/jiaju/frontend/dist;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代（前台域名下 /api 也代理到后端，便于演示；生产建议 www 只读公开接口）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # 上传文件（本地模拟 OSS，生产切对象存储后可移除）
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# ---------- 后台 sys.yt-domain.com ----------
server {
    listen 443 ssl http2;
    server_name sys.yt-domain.com;

    ssl_certificate     /etc/nginx/ssl/sys.yt-domain.com.pem;
    ssl_certificate_key /etc/nginx/ssl/sys.yt-domain.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/jiaju/backend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ---------- HTTP → HTTPS 跳转 ----------
server {
    listen 80;
    server_name www.yt-domain.com sys.yt-domain.com;
    return 301 https://$host$request_uri;
}
