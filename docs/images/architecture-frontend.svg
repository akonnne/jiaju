<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#7A5C3E"/>
    </marker>
    <g id="mod">
      <rect x="0" y="0" width="150" height="44" rx="6" fill="#FFFFFF" stroke="#E5DCCE"/>
      <text x="75" y="27" text-anchor="middle" font-size="12.5" fill="#2B2520"></text>
    </g>
  </defs>
  <style>
    .bg{fill:#FAF7F1}
    .layer{fill:none;stroke:#B9A187;stroke-dasharray:6 4;rx:14}
    .layer-name{font-size:14px;font-weight:700;fill:#5F4730}
    .b{fill:#FFFFFF;stroke:#E5DCCE;stroke-width:1;rx:6}
    .b-head{fill:#7A5C3E;rx:6}
    .b-name{font-size:12.5px;font-weight:600;fill:#FFFFFF}
    .b-sub{font-size:10.5px;fill:#8E8577}
    .b-text{font-size:12px;fill:#2B2520}
    .b-walnut{fill:#7A5C3E;stroke:#7A5C3E;rx:6}
    .b-sand{fill:#F0EAE1;stroke:#C9BBA0;rx:6}
    .arr{stroke:#7A5C3E;stroke-width:1.6;fill:none}
    .arr-label{font-size:11px;fill:#6E675E}
    .note{font-size:11px;fill:#6E675E}
  </style>

  <rect class="bg" width="1200" height="760"/>
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#2B2520">前台展示系统 · 模块架构图（frontend/）</text>
  <text x="600" y="56" text-anchor="middle" class="note">React 18 + Vite + TypeScript + Tailwind CSS · 5 项主导航 / 14 个页面 · 依据开发技术文档第 5 章</text>

  <!-- ===== 第 1 层：用户 ===== -->
  <rect class="layer" x="30" y="74" width="1140" height="66"/>
  <text x="46" y="94" class="layer-name">用户层</text>
  <rect class="b-head" x="500" y="88" width="200" height="40"/>
  <text x="600" y="113" text-anchor="middle" class="b-name">C 端消费者（PC / 移动端）</text>

  <!-- ===== 第 2 层：页面层 ===== -->
  <rect class="layer" x="30" y="160" width="1140" height="210"/>
  <text x="46" y="180" class="layer-name">页面层（14 页）</text>

  <text x="60" y="202" class="b-text" font-weight="700" fill="#5F4730">首页</text>
  <rect class="b" x="60" y="210" width="120" height="40"/><text x="120" y="235" text-anchor="middle" class="b-text">HomePage</text>
  <text x="200" y="202" class="b-text" font-weight="700" fill="#5F4730">产品</text>
  <rect class="b" x="200" y="210" width="120" height="40"/><text x="260" y="235" text-anchor="middle" class="b-text">ProductsPage</text>
  <rect class="b" x="330" y="210" width="120" height="40"/><text x="390" y="235" text-anchor="middle" class="b-text">ProductDetail</text>
  <rect class="b-sand" x="460" y="210" width="120" height="40"/><text x="520" y="235" text-anchor="middle" class="b-text">CasesPage（P1）</text>
  <text x="600" y="202" class="b-text" font-weight="700" fill="#5F4730">新闻</text>
  <rect class="b" x="600" y="210" width="120" height="40"/><text x="660" y="235" text-anchor="middle" class="b-text">NewsPage</text>
  <rect class="b" x="730" y="210" width="120" height="40"/><text x="790" y="235" text-anchor="middle" class="b-text">NewsDetail</text>
  <text x="870" y="202" class="b-text" font-weight="700" fill="#5F4730">招聘</text>
  <rect class="b" x="870" y="210" width="120" height="40"/><text x="930" y="235" text-anchor="middle" class="b-text">CareersPage</text>
  <rect class="b" x="1000" y="210" width="150" height="40"/><text x="1075" y="235" text-anchor="middle" class="b-text">Social / Campus</text>

  <text x="60" y="282" class="b-text" font-weight="700" fill="#5F4730">关于我们</text>
  <rect class="b" x="60" y="290" width="120" height="40"/><text x="120" y="315" text-anchor="middle" class="b-text">AboutPage</text>
  <rect class="b" x="200" y="290" width="130" height="40"/><text x="265" y="315" text-anchor="middle" class="b-text">MilestonesPage</text>
  <rect class="b" x="350" y="290" width="120" height="40"/><text x="410" y="315" text-anchor="middle" class="b-text">BrandPage</text>
  <rect class="b" x="490" y="290" width="120" height="40"/><text x="550" y="315" text-anchor="middle" class="b-text">ContactPage</text>
  <rect class="b" x="630" y="290" width="130" height="40"/><text x="695" y="315" text-anchor="middle" class="b-text">JobDetailPage</text>

  <!-- ===== 第 3 层：路由与状态 ===== -->
  <rect class="layer" x="30" y="396" width="1140" height="64"/>
  <text x="46" y="416" class="layer-name">路由与状态层</text>
  <rect class="b-walnut" x="140" y="408" width="180" height="40"/><text x="230" y="433" text-anchor="middle" class="b-name">React Router 6（5 导航路由表）</text>
  <rect class="b-walnut" x="380" y="408" width="160" height="40"/><text x="460" y="433" text-anchor="middle" class="b-name">Zustand（轻量全局态）</text>
  <rect class="b-walnut" x="600" y="408" width="160" height="40"/><text x="680" y="433" text-anchor="middle" class="b-name">Hooks（useXXX）</text>
  <rect class="b" x="820" y="408" width="280" height="40"/><text x="960" y="433" text-anchor="middle" class="b-text">MainLayout（Header 导航 + Footer）</text>

  <!-- ===== 第 4 层：组件层 ===== -->
  <rect class="layer" x="30" y="486" width="1140" height="64"/>
  <text x="46" y="506" class="layer-name">通用组件层（UI/UX 设计系统落地）</text>
  <rect class="b" x="80" y="498" width="130" height="40"/><text x="145" y="523" text-anchor="middle" class="b-text">NavBar（5 项下拉）</text>
  <rect class="b" x="230" y="498" width="110" height="40"/><text x="285" y="523" text-anchor="middle" class="b-text">BannerCarousel</text>
  <rect class="b" x="360" y="498" width="110" height="40"/><text x="415" y="523" text-anchor="middle" class="b-text">ProductCard</text>
  <rect class="b" x="490" y="498" width="100" height="40"/><text x="540" y="523" text-anchor="middle" class="b-text">NewsCard</text>
  <rect class="b" x="610" y="498" width="110" height="40"/><text x="665" y="523" text-anchor="middle" class="b-text">SeriesCard</text>
  <rect class="b" x="740" y="498" width="110" height="40"/><text x="795" y="523" text-anchor="middle" class="b-text">JobListItem</text>
  <rect class="b" x="870" y="498" width="120" height="40"/><text x="930" y="523" text-anchor="middle" class="b-text">ContactForm</text>
  <rect class="b" x="1010" y="498" width="130" height="40"/><text x="1075" y="523" text-anchor="middle" class="b-text">Pagination / Toast</text>

  <!-- ===== 第 5 层：API 层 ===== -->
  <rect class="layer" x="30" y="576" width="1140" height="64"/>
  <text x="46" y="596" class="layer-name">API 层（axios 统一封装）</text>
  <rect class="b" x="70" y="588" width="140" height="40"/><text x="140" y="613" text-anchor="middle" class="b-text">http.ts（响应拦截）</text>
  <rect class="b" x="230" y="588" width="120" height="40"/><text x="290" y="613" text-anchor="middle" class="b-text">bannerApi</text>
  <rect class="b" x="370" y="588" width="120" height="40"/><text x="430" y="613" text-anchor="middle" class="b-text">productApi</text>
  <rect class="b" x="510" y="588" width="110" height="40"/><text x="565" y="613" text-anchor="middle" class="b-text">newsApi</text>
  <rect class="b" x="640" y="588" width="130" height="40"/><text x="705" y="613" text-anchor="middle" class="b-text">companyApi</text>
  <rect class="b" x="790" y="588" width="130" height="40"/><text x="855" y="613" text-anchor="middle" class="b-text">messageApi</text>
  <rect class="b" x="940" y="588" width="120" height="40"/><text x="1000" y="613" text-anchor="middle" class="b-text">jobApi</text>

  <!-- ===== 第 6 层：后端 Api ===== -->
  <rect class="layer" x="30" y="666" width="1140" height="70"/>
  <text x="46" y="686" class="layer-name">后端 Api（Python FastAPI）</text>
  <rect class="b-walnut" x="180" y="678" width="260" height="44"/><text x="310" y="704" text-anchor="middle" class="b-name">/api/public/*（10 个公开接口，无鉴权）</text>
  <rect class="b-walnut" x="520" y="678" width="180" height="44"/><text x="610" y="704" text-anchor="middle" class="b-name">FastAPI 服务（8000）</text>
  <rect class="b-sand" x="760" y="678" width="150" height="44"/><text x="835" y="695" text-anchor="middle" class="b-text">SQLite yt.db</text>
  <text x="835" y="712" text-anchor="middle" class="note">16 张表</text>
  <rect class="b-sand" x="950" y="678" width="160" height="44"/><text x="1030" y="695" text-anchor="middle" class="b-text">对象存储 COS/OSS</text>
  <text x="1030" y="712" text-anchor="middle" class="note">图片</text>

  <!-- ===== 层间箭头 ===== -->
  <line class="arr" x1="600" y1="128" x2="600" y2="158" marker-end="url(#a1)"/>
  <line class="arr" x1="600" y1="370" x2="600" y2="396" marker-end="url(#a1)"/>
  <line class="arr" x1="600" y1="460" x2="600" y2="486" marker-end="url(#a1)"/>
  <line class="arr" x1="600" y1="550" x2="600" y2="576" marker-end="url(#a1)"/>
  <line class="arr" x1="310" y1="640" x2="310" y2="666" marker-end="url(#a1)"/>
  <text x="620" y="385" class="arr-label">路由跳转</text>
  <text x="620" y="477" class="arr-label">渲染组件</text>
  <text x="620" y="567" class="arr-label">调用 API</text>
  <text x="330" y="658" class="arr-label">HTTP / REST</text>
</svg>
