<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="crow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,5 L0,10 M0,2.5 L5,5 L0,7.5" fill="none" stroke="#7A5C3E" stroke-width="1.2"/>
    </marker>
    <marker id="crowN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,5 L0,10 M0,2.5 L8,5 M0,7.5 L8,5" fill="none" stroke="#7A5C3E" stroke-width="1.2"/>
    </marker>
  </defs>

  <style>
    .bg{fill:#FAF7F1}
    .grp{fill:none;stroke:#C9BBA0;stroke-dasharray:6 4;rx:14}
    .grp-title{font-size:15px;font-weight:700;fill:#5F4730}
    .ent{fill:#FFFFFF;stroke:#E5DCCE;stroke-width:1}
    .ent-head{fill:#7A5C3E}
    .ent-head-alt{fill:#5F4730}
    .ent-name{font-size:14px;font-weight:700;fill:#FFFFFF}
    .fld{font-size:12px;fill:#2B2520}
    .pk{font-weight:700;fill:#C0392B}
    .fk{fill:#7A5C3E}
    .rel{stroke:#7A5C3E;stroke-width:1.4;fill:none}
    .card{font-size:11px;font-weight:700;fill:#7A5C3E}
    .note{font-size:12px;fill:#6E675E}
    .legend{font-size:11px;fill:#6E675E}
    .notebox{fill:#FFFDF8;stroke:#E5DCCE;stroke-width:1}
    .note-title{font-size:13px;font-weight:700;fill:#5F4730}
  </style>

  <!-- 背景 -->
  <rect class="bg" width="1280" height="820"/>

  <!-- 图标题 -->
  <text x="640" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#2B2520">YT 家具官网 · RBAC 权限模型 ER 图</text>
  <text x="640" y="58" text-anchor="middle" class="note">sys_users / user_role / role / role_permission / permission · 去 Admin 化命名（system 角色、10000 初始账号）</text>

  <!-- 分组框 -->
  <rect class="grp" x="30" y="80" width="1230" height="710"/>
  <text x="46" y="104" class="grp-title">RBAC 权限域（账户 · 角色 · 权限）</text>

  <!-- ============ 实体：sys_users ============ -->
  <rect class="ent" x="50" y="150" width="220" height="186" rx="6"/>
  <rect class="ent-head" x="50" y="150" width="220" height="30" rx="6"/>
  <text x="62" y="171" class="ent-name">sys_users（系统用户表）</text>
  <text x="62" y="200" class="fld"><tspan class="pk">id</tspan> INTEGER PK</text>
  <text x="62" y="224" class="fld"><tspan class="fk">username</tspan> TEXT UQ 登录名</text>
  <text x="62" y="248" class="fld">password_hash TEXT bcrypt</text>
  <text x="62" y="272" class="fld">name TEXT 姓名</text>
  <text x="62" y="296" class="fld">status INTEGER 0停用/1启用</text>
  <text x="62" y="320" class="fld"><tspan class="fk">created_by</tspan> → sys_users.id</text>

  <!-- ============ 实体：user_role ============ -->
  <rect class="ent" x="320" y="210" width="180" height="128" rx="6"/>
  <rect class="ent-head-alt" x="320" y="210" width="180" height="30" rx="6"/>
  <text x="332" y="231" class="ent-name">user_role</text>
  <text x="332" y="262" class="fld"><tspan class="fk">user_id</tspan> PK,FK</text>
  <text x="332" y="292" class="fld"><tspan class="fk">role_id</tspan> PK,FK</text>
  <text x="332" y="320" class="note">联合主键</text>

  <!-- ============ 实体：role ============ -->
  <rect class="ent" x="560" y="138" width="220" height="200" rx="6"/>
  <rect class="ent-head" x="560" y="138" width="220" height="30" rx="6"/>
  <text x="572" y="159" class="ent-name">role（角色表）</text>
  <text x="572" y="188" class="fld"><tspan class="pk">id</tspan> INTEGER PK</text>
  <text x="572" y="212" class="fld"><tspan class="fk">code</tspan> TEXT UQ</text>
  <text x="572" y="236" class="fld">name TEXT 角色名</text>
  <text x="572" y="260" class="fld">is_preset INTEGER 预设</text>
  <text x="572" y="290" class="note">system / editor / service</text>
  <text x="572" y="312" class="note">3 个预设角色</text>

  <!-- ============ 实体：role_permission ============ -->
  <rect class="ent" x="840" y="210" width="190" height="128" rx="6"/>
  <rect class="ent-head-alt" x="840" y="210" width="190" height="30" rx="6"/>
  <text x="852" y="231" class="ent-name">role_permission</text>
  <text x="852" y="262" class="fld"><tspan class="fk">role_id</tspan> PK,FK</text>
  <text x="852" y="292" class="fld"><tspan class="fk">permission_id</tspan> PK,FK</text>
  <text x="852" y="320" class="note">联合主键</text>

  <!-- ============ 实体：permission ============ -->
  <rect class="ent" x="1060" y="120" width="190" height="430" rx="6"/>
  <rect class="ent-head" x="1060" y="120" width="190" height="30" rx="6"/>
  <text x="1072" y="141" class="ent-name">permission</text>
  <text x="1072" y="170" class="fld"><tspan class="pk">id</tspan> INTEGER PK</text>
  <text x="1072" y="194" class="fld"><tspan class="fk">code</tspan> TEXT UQ</text>
  <text x="1072" y="218" class="fld">name TEXT 权限名</text>
  <text x="1072" y="242" class="fld">module TEXT 模块</text>
  <text x="1072" y="266" class="fld">action TEXT read/write</text>
  <line x1="1072" y1="282" x2="1238" y2="282" stroke="#E5DCCE"/>
  <text x="1072" y="304" class="note">16 个预设权限点：</text>
  <text x="1072" y="324" class="note">product / news /</text>
  <text x="1072" y="344" class="note">banner / company /</text>
  <text x="1072" y="364" class="note">job / message / user</text>
  <text x="1072" y="384" class="note">× read + write</text>
  <text x="1072" y="408" class="note">+ role:read</text>
  <text x="1072" y="428" class="note">+ stats:read</text>

  <!-- ============ 关系连线 ============ -->
  <!-- sys_users 1 — N user_role -->
  <line class="rel" x1="270" y1="248" x2="320" y2="270" marker-end="url(#crowN)"/>
  <text x="278" y="240" class="card">1</text>
  <text x="296" y="262" class="card">N</text>

  <!-- user_role N — 1 role -->
  <line class="rel" x1="500" y1="270" x2="560" y2="248" marker-end="url(#crow1)"/>
  <text x="512" y="262" class="card">N</text>
  <text x="528" y="240" class="card">1</text>

  <!-- role 1 — N role_permission -->
  <line class="rel" x1="780" y1="248" x2="840" y2="270" marker-end="url(#crowN)"/>
  <text x="788" y="240" class="card">1</text>
  <text x="806" y="262" class="card">N</text>

  <!-- role_permission N — 1 permission -->
  <line class="rel" x1="1030" y1="270" x2="1060" y2="300" marker-end="url(#crow1)"/>
  <text x="1000" y="262" class="card">N</text>
  <text x="1038" y="292" class="card">1</text>

  <!-- ============ 说明框 ============ -->
  <rect class="notebox" x="50" y="630" width="1180" height="140" rx="8"/>
  <text x="66" y="658" class="note-title">权限绑定说明</text>
  <text x="66" y="684" class="note">① MVP 仅预置一个账号 <tspan class="pk">10000</tspan>（system 角色，纯数字用户名），其余角色（editor / service）作为可分配角色预置，便于后续扩展多账号。</text>
  <text x="66" y="708" class="note">② system 角色绑定全部 16 个权限点；editor 拥有 product/news/banner/company/job 的 read+write 与 stats:read；service 拥有 message 的 read+write 与 stats:read。</text>
  <text x="66" y="732" class="note">③ JWT 登录时将账号角色与权限码写入令牌，每次请求按权限码校验，无权限返回 403（依据 PRD 4.2 / 技术文档 5.3.x）。</text>

  <!-- ============ 图例 ============ -->
  <rect x="1060" y="630" width="170" height="140" class="notebox" rx="8"/>
  <text x="1076" y="654" class="note-title">图例</text>
  <text x="1076" y="680" class="legend"><tspan class="pk">红字</tspan> = 主键 PK</text>
  <text x="1076" y="702" class="legend"><tspan class="fk">棕字</tspan> = 外键 FK</text>
  <text x="1076" y="726" class="legend">UQ = 唯一约束</text>
  <text x="1076" y="748" class="legend">1 / N = 基数</text>
</svg>
