<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 950" width="1440" height="950" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="crow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,5 L0,10 M0,2.5 L5,5 L0,7.5" fill="none" stroke="#7A5C3E" stroke-width="1.2"/>
    </marker>
    <marker id="crowN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,5 L0,10 M0,2.5 L8,5 M0,7.5 L8,5" fill="none" stroke="#7A5C3E" stroke-width="1.2"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#7A5C3E"/>
    </marker>
  </defs>

  <style>
    .bg{fill:#FAF7F1}
    .grp{fill:none;stroke:#C9BBA0;stroke-dasharray:6 4;rx:14}
    .grp-title{font-size:15px;font-weight:700;fill:#5F4730}
    .ent{fill:#FFFFFF;stroke:#E5DCCE;stroke-width:1}
    .ent-head{fill:#7A5C3E}
    .ent-head-alt{fill:#5F4730}
    .ent-name{font-size:14px;font-weight:700;fill:#FFFFFF}
    .fld{font-size:12px;fill:#2B2520}
    .pk{font-weight:700;fill:#C0392B}
    .fk{fill:#7A5C3E}
    .rel{stroke:#7A5C3E;stroke-width:1.4;fill:none}
    .rel-label{font-size:11px;fill:#6E675E}
    .note{font-size:12px;fill:#6E675E}
    .legend{font-size:11px;fill:#6E675E}
  </style>

  <!-- 背景 -->
  <rect class="bg" width="1440" height="950"/>

  <!-- 图标题 -->
  <text x="720" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#2B2520">YT 家具官网 · 数据库 ER 图（16 张表）</text>
  <text x="720" y="58" text-anchor="middle" class="note">SQLite · 去 Admin 化命名（sys_users / system 角色）· 依据 PRD v1.8 数据模型 8.1~8.14（含 8.1.1 department）</text>

  <!-- ============ 分组：RBAC 权限 ============ -->
  <rect class="grp" x="30" y="80" width="560" height="300"/>
  <text x="46" y="102" class="grp-title">RBAC 权限域</text>

  <!-- sys_users -->
  <g>
    <rect class="ent" x="50" y="120" width="200" height="150" rx="8"/>
    <rect class="ent-head" x="50" y="120" width="200" height="30" rx="8"/>
    <rect class="ent-head" x="50" y="140" width="200" height="10"/>
    <text x="150" y="140" text-anchor="middle" class="ent-name">sys_users 系统用户</text>
    <text x="62" y="172" class="fld"><tspan class="pk">id</tspan> PK</text>
    <text x="62" y="192" class="fld"><tspan class="pk">username</tspan> UNIQUE</text>
    <text x="62" y="212" class="fld">name / password_hash</text>
    <text x="62" y="232" class="fld">status / last_login_at</text>
    <text x="62" y="252" class="fld">created_by</text>
  </g>

  <!-- role -->
  <g>
    <rect class="ent" x="310" y="120" width="200" height="130" rx="8"/>
    <rect class="ent-head" x="310" y="120" width="200" height="30" rx="8"/>
    <rect class="ent-head" x="310" y="140" width="200" height="10"/>
    <text x="410" y="140" text-anchor="middle" class="ent-name">role 角色</text>
    <text x="322" y="172" class="fld"><tspan class="pk">id</tspan> PK</text>
    <text x="322" y="192" class="fld"><tspan class="pk">code</tspan> UNIQUE（system/editor/service）</text>
    <text x="322" y="212" class="fld">name / description</text>
    <text x="322" y="232" class="fld">is_preset</text>
  </g>

  <!-- permission -->
  <g>
    <rect class="ent" x="50" y="310" width="200" height="130" rx="8"/>
    <rect class="ent-head" x="50" y="310" width="200" height="30" rx="8"/>
    <rect class="ent-head" x="50" y="330" width="200" height="10"/>
    <text x="150" y="330" text-anchor="middle" class="ent-name">permission 权限点</text>
    <text x="62" y="362" class="fld"><tspan class="pk">id</tspan> PK</text>
    <text x="62" y="382" class="fld"><tspan class="pk">code</tspan> UNIQUE（product:read…）</text>
    <text x="62" y="402" class="fld">module / action</text>
    <text x="62" y="422" class="fld">is_preset</text>
  </g>

  <!-- user_role -->
  <g>
    <rect class="ent" x="310" y="310" width="200" height="110" rx="8"/>
    <rect class="ent-head-alt" x="310" y="310" width="200" height="30" rx="8"/>
    <rect class="ent-head-alt" x="310" y="330" width="200" height="10"/>
    <text x="410" y="330" text-anchor="middle" class="ent-name">user_role 用户-角色</text>
    <text x="322" y="362" class="fld"><tspan class="pk">user_id</tspan> PK/FK → sys_users</text>
    <text x="322" y="382" class="fld"><tspan class="pk">role_id</tspan> PK/FK → role</text>
    <text x="322" y="402" class="fld">（多对多关联）</text>
  </g>

  <!-- role_permission -->
  <g>
    <rect class="ent" x="310" y="440" width="200" height="110" rx="8"/>
    <rect class="ent-head-alt" x="310" y="440" width="200" height="30" rx="8"/>
    <rect class="ent-head-alt" x="310" y="460" width="200" height="10"/>
    <text x="410" y="460" text-anchor="middle" class="ent-name">role_permission 角色-权限</text>
    <text x="322" y="492" class="fld"><tspan class="pk">role_id</tspan> PK/FK → role</text>
    <text x="322" y="512" class="fld"><tspan class="pk">permission_id</tspan> PK/FK → permission</text>
    <text x="322" y="532" class="fld">（多对多关联）</text>
  </g>

  <!-- ============ 分组：内容管理 ============ -->
  <rect class="grp" x="610" y="80" width="560" height="300"/>
  <text x="626" y="102" class="grp-title">内容管理域</text>

  <!-- product_series -->
  <g>
    <rect class="ent" x="630" y="120" width="220" height="130" rx="8"/>
    <rect class="ent-head" x="630" y="120" width="220" height="30" rx="8"/>
    <rect class="ent-head" x="630" y="140" width="220" height="10"/>
    <text x="740" y="140" text-anchor="middle" class="ent-name">product_series 产品系列</text>
    <text x="642" y="172" class="fld"><tspan class="pk">id</tspan> PK</text>
    <text x="642" y="192" class="fld">name / description</text>
    <text x="642" y="212" class="fld">cover_image / sort_order</text>
    <text x="642" y="232" class="fld">status（0停用/1启用）</text>
  </g>

  <!-- product -->
  <g>
    <rect class="ent" x="900" y="120" width="230" height="265" rx="8"/>
    <rect class="ent-head" x="900" y="120" width="230" height="30" rx="8"/>
    <rect class="ent-head" x="900" y="140" width="230" height="10"/>
    <text x="1015" y="140" text-anchor="middle" class="ent-name">product 产品</text>
    <text x="912" y="172" class="fld"><tspan class="pk">id</tspan> PK</text>
    <text x="912" y="192" class="fld"><tspan class="fk">series_id</tspan> FK → product_series</text>
    <text x="912" y="212" class="fld">name / model / category</text>
    <text x="912" y="232" class="fld">category_code(1-4) / product_type</text>
    <text x="912" y="252" class="fld"><tspan class="fk">material_id</tspan> FK → material</text>
    <text x="912" y="272" class="fld">original_price / discount_price</text>
    <text x="912" y="292" class="fld">is_customizable / sort_order</text>
    <text x="912" y="312" class="fld">description / params(JSON)</text>
    <text x="912" y="332" class="fld">cover_image / images(JSON)</text>
    <text x="912" y="352" class="fld">status / view_count</text>
  </g>

  <!-- news -->
  <g>
    <rect class="ent" x="630" y="300" width="220" height="130" rx="8"/>
    <rect class="ent-head" x="630" y="300" width="220" height="30" rx="8"/>
    <rect class="ent-head" x="630" y="320" width="220" height="10"/>
    <text x="740" y="320" text-anchor="middle" class="ent-name">news 新闻</text>
    <text x="642" y="352" class="fld"><tspan class="pk">id</tspan> PK</text>
    <text x="642" y="372" class="fld">title / summary</text>
    <text x="642" y="392" class="fld">category（企业/行业 P1）</text>
    <text x="642" y="412" class="fld">content / publish_time</text>
  </g>

  <!-- banner -->
  <g>
    <rect class="ent" x="900" y="300" width="230" height="130" rx="8"/>
    <rect class="ent-head" x="900" y="300" width="230" height="30" rx="8"/>
    <rect class="ent-head" x="900" y="320" width="230" height="10"/>
    <text x="1015" y="320" text-anchor="middle" class="ent-name">banner 轮播图</text>
    <text x="912" y="352" class="fld"><tspan class="pk">id</tspan> PK</text>
    <text x="912" y="372" class="fld">title / image / link_url</text>
    <text x="912" y="392" class="fld">sort_order</text>
    <text x="912" y="412" class="fld">status（0停用/1启用）</text>
  </g>

  <!-- company_info -->
  <g>
    <rect class="ent" x="630" y="440" width="220" height="150" rx="8"/>
    <rect class="ent-head" x="630" y="440" width="220" height="30" rx="8"/>
    <rect class="ent-head" x="630" y="460" width="220" height="10"/>
    <text x="740" y="460" text-anchor="middle" class="ent-name">company_info 公司介绍</text>
    <text x="642" y="492" class="fld"><tspan class="pk">id</tspan> PK（固定 1 行）</text>
    <text x="642" y="512" class="fld">slogan / intro</text>
    <text x="642" y="532" class="fld">milestones / honors / concepts(JSON)</text>
    <text x="642" y="552" class="fld">address / phone / email</text>
    <text x="642" y="572" class="fld">job_email / job_phone</text>
  </g>

  <!-- job_position -->
  <g>
    <rect class="ent" x="900" y="440" width="230" height="150" rx="8"/>
    <rect class="ent-head" x="900" y="440" width="230" height="30" rx="8"/>
    <rect class="ent-head" x="900" y="460" width="230" height="10"/>
    <text x="1015" y="460" text-anchor="middle" class="ent-name">job_position 招聘职位</text>
    <text x="912" y="492" class="fld"><tspan class="pk">id</tspan> PK</text>
    <text x="912" y="512" class="fld">title / job_type（social/campus）</text>
    <text x="912" y="532" class="fld">department / location / headcount</text>
    <text x="912" y="552" class="fld">description / requirement</text>
    <text x="912" y="572" class="fld">status / view_count</text>
  </g>

  <!-- material -->
  <g>
    <rect class="ent" x="1180" y="120" width="230" height="130" rx="8"/>
    <rect class="ent-head" x="1180" y="120" width="230" height="30" rx="8"/>
    <rect class="ent-head" x="1180" y="140" width="230" height="10"/>
    <text x="1295" y="140" text-anchor="middle" class="ent-name">material 材质字典</text>
    <text x="1192" y="172" class="fld"><tspan class="pk">id</tspan> PK</text>
    <text x="1192" y="192" class="fld">name（唯一,如 北美黑胡桃）</text>
    <text x="1192" y="212" class="fld">sort_order / status（0停用/1启用）</text>
  </g>

  <!-- ============ 分组：线索与统计 ============ -->
  <rect class="grp" x="30" y="600" width="1140" height="260"/>
  <text x="46" y="622" class="grp-title">线索与统计域</text>

  <!-- message -->
  <g>
    <rect class="ent" x="50" y="640" width="260" height="150" rx="8"/>
    <rect class="ent-head" x="50" y="640" width="260" height="30" rx="8"/>
    <rect class="ent-head" x="50" y="660" width="260" height="10"/>
    <text x="180" y="660" text-anchor="middle" class="ent-name">message 留言线索</text>
    <text x="62" y="692" class="fld"><tspan class="pk">id</tspan> PK</text>
    <text x="62" y="712" class="fld">name / phone / content</text>
    <text x="62" y="732" class="fld">source（contact/join P1）</text>
    <text x="62" y="752" class="fld">status（new/contacted/done）</text>
    <text x="62" y="772" class="fld">ip / created_at</text>
  </g>

  <!-- page_view_log -->
  <g>
    <rect class="ent" x="470" y="640" width="260" height="130" rx="8"/>
    <rect class="ent-head-alt" x="470" y="640" width="260" height="30" rx="8"/>
    <rect class="ent-head-alt" x="470" y="660" width="260" height="10"/>
    <text x="600" y="660" text-anchor="middle" class="ent-name">page_view_log 访问统计</text>
    <text x="482" y="692" class="fld"><tspan class="pk">id</tspan> PK</text>
    <text x="482" y="712" class="fld">page_type / target_id</text>
    <text x="482" y="732" class="fld">view_date / view_count（按天聚合）</text>
  </g>

  <!-- audit_log -->
  <g>
    <rect class="ent" x="890" y="640" width="260" height="150" rx="8"/>
    <rect class="ent-head-alt" x="890" y="640" width="260" height="30" rx="8"/>
    <rect class="ent-head-alt" x="890" y="660" width="260" height="10"/>
    <text x="1020" y="660" text-anchor="middle" class="ent-name">audit_log 审计日志</text>
    <text x="902" y="692" class="fld"><tspan class="pk">id</tspan> PK</text>
    <text x="902" y="712" class="fld"><tspan class="fk">user_id</tspan> FK → sys_users</text>
    <text x="902" y="732" class="fld">action / resource / resource_id</text>
    <text x="902" y="752" class="fld">detail(JSON) / ip / status</text>
    <text x="902" y="772" class="fld">created_at</text>
  </g>

  <!-- ============ 关系连线 ============ -->
  <!-- sys_users 1:N user_role -->
  <line class="rel" x1="150" y1="270" x2="150" y2="292" marker-start="url(#crow1)" marker-end="url(#crowN)"/>
  <text x="160" y="288" class="rel-label">1:N</text>
  <!-- role 1:N user_role -->
  <line class="rel" x1="410" y1="250" x2="410" y2="292" marker-start="url(#crow1)" marker-end="url(#crowN)"/>
  <text x="420" y="278" class="rel-label">1:N</text>
  <!-- role 1:N role_permission -->
  <line class="rel" x1="410" y1="440" x2="410" y2="420" marker-start="url(#crow1)" marker-end="url(#crowN)"/>
  <text x="420" y="434" class="rel-label">1:N</text>
  <!-- permission 1:N role_permission -->
  <path class="rel" d="M250,375 L300,375 L300,495 L310,495" marker-start="url(#crow1)" marker-end="url(#crowN)"/>
  <text x="272" y="368" class="rel-label">1:N</text>
  <!-- product_series 1:N product -->
  <line class="rel" x1="850" y1="200" x2="900" y2="200" marker-start="url(#crow1)" marker-end="url(#crowN)"/>
  <text x="862" y="192" class="rel-label">1:N</text>
  <!-- material 1:N product -->
  <path class="rel" d="M1130,252 L1180,182" marker-start="url(#crowN)" marker-end="url(#crow1)"/>
  <text x="1142" y="214" class="rel-label">1:N</text>
  <!-- sys_users 1:N audit_log -->
  <line class="rel" x1="250" y1="222" x2="470" y2="160" marker-start="url(#crow1)" marker-end="url(#crowN)" stroke-dasharray="4 3"/>
  <text x="320" y="180" class="rel-label">1:N（操作人）</text>

  <!-- ============ 图例 ============ -->
  <g transform="translate(40,880)">
    <text x="0" y="0" class="legend" font-weight="700" fill="#2B2520">图例：</text>
    <text x="48" y="0" class="legend"><tspan class="pk">PK</tspan> 主键　·　<tspan class="fk">FK</tspan> 外键　·　<tspan font-weight="700">UNIQUE</tspan> 唯一</text>
    <text x="330" y="0" class="legend">实体框颜色：<rect x="442" y="-12" width="14" height="14" rx="3" fill="#7A5C3E"/> 主域实体　<rect x="530" y="-12" width="14" height="14" rx="3" fill="#5F4730"/> 关联/统计表</text>
    <text x="760" y="0" class="legend">连线：<line x1="830" y1="-5" x2="870" y2="-5" stroke="#7A5C3E" stroke-width="1.4"/> 外键关系（标注 1:N 基数）</text>
  </g>
  <text x="720" y="928" text-anchor="middle" font-size="12.5" fill="#7A6F63">全 16 张表统一携带 5 个审计字段：is_activate（默认 1 激活）· created_at（创建人 FK→sys_users.id）· created_date（创建时间）· updated_at（修改人 FK→sys_users.id）· updated_date（修改时间）</text>
</svg>
